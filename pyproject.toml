[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashy-dns"
version = "2.0.0"
description = "Fast, asynchronous DNS benchmarking tool and Linux auto-switching daemon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.scripts]
flashy-dns = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
